##############################################################################
# @file: nginx.conf
# @node: Core Server (Frankfurt)
# @component: Reverse Proxy / Data Plane Offloading Layer
# @objective: Terminate TLS and route traffic to the two registries while
#             keeping buffering disabled to isolate I/O wait and bufferbloat.
##############################################################################
events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;

    # [DATA PLANE OFFLOADING] No request-body limit is used so that large
    # layers do not stall on the proxy and the I/O bottleneck remains visible.
    client_max_body_size 0;
    # [DOCKER V2 COMPATIBILITY] Required for chunked transfers in the API flow.
    chunked_transfer_encoding on;

    upstream registry_std {
        server registry-standard:5000;
    }

    upstream registry_harb {
        server registry-harbor:5000;
    }

    server {
        listen 5000;
        location / {
            # [BUFFERBLOAT MITIGATION] The proxy forwards traffic without
            # accumulating payload on local disk, so QoS reflects the backend.
            proxy_pass http://registry_std;
        }
    }

    server {
        listen 8080;
        location / {
            # [SIDECAR TAX / STATEFUL PATH] Harbor traffic is forwarded to the
            # dedicated registry, preserving the distinction between backends.
            # [L7 BLOB STREAMING] This directive is mandatory to stream blobs at
            # Layer 7 and to prevent an I/O bottleneck on the proxy host.
            proxy_request_buffering off;
            proxy_pass http://registry_harb;
        }
    }
}
